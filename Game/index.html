<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (optional) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Tic Tac Toe</h1>
        <div class="game-board d-grid gap-2 mx-auto" style="width: 300px; grid-template-columns: repeat(3, 1fr);">
            <button class="btn btn-outline-primary game-cell" data-cell-index="0"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="1"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="2"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="3"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="4"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="5"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="6"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="7"></button>
            <button class="btn btn-outline-primary game-cell" data-cell-index="8"></button>
        </div>
        <div class="text-center mt-4">
            <h2 id="game-status">Player X's Turn</h2>
            <button class="btn btn-warning mt-3" id="reset-button">Reset Game</button>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for components like modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
